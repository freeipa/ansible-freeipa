---
trigger:
- master

pool:
  vmImage: 'ubuntu-26.04'

variables:
  ansible_version: "-core >=2.18,<2.19"
  ansible_rawhide_version: "-core >=2.22.0b0,<2.23"
  ansible_latest: "-core"
  ansible_minimum: "-core <2.16"
  distros: "fedora-latest,c9s,c10s"

stages:

- stage: fedora_latest_ansible_latest
  dependsOn: []
  jobs:
  - template: templates/group_tests.yml
    parameters:
      build_number: $(Build.BuildNumber)
      distro: fedora-latest
      ansible_version: ${{ variables.ansible_latest }}
      skip_git_test: true

- stage: fedora_latest_ansible_2_15
  dependsOn: []
  jobs:
  - template: templates/group_tests.yml
    parameters:
      build_number: $(Build.BuildNumber)
      distro: fedora-latest
      ansible_version: ${{ variables.ansbile_minimum }}
      skip_git_test: true

# Supported distros

- ${{ each distro in split(variables.distros, ',') }}:
  - stage: ${{ replace(distro, '-', '_') }}_ansible_2_18
    dependsOn: []
    jobs:
    - template: templates/group_tests.yml
      parameters:
        build_number: $(Build.BuildNumber)
        distro: ${{ distro }}
        ansible_version: ${{ variables.ansible_version }}
        skip_git_test: true
        test_galaxy: false

# Fedora Rawhide requires the unreleased Ansible 2.22 series.

- stage: fedora_rawhide_ansible_2_22
  dependsOn: []
  jobs:
  - template: templates/group_tests.yml
    parameters:
      build_number: $(Build.BuildNumber)
      distro: fedora-rawhide
      ansible_version: ${{ variables.ansible_rawhide_version }}
      python_version: '3.12'
      skip_git_test: true
      test_galaxy: false

# Galaxy on Fedora

- stage: galaxy_fedora_latest_ansible_2_18
  dependsOn: []
  jobs:
  - template: templates/group_tests.yml
    parameters:
      build_number: $(Build.BuildNumber)
      distro: fedora-latest
      ansible_version: ${{ variables.ansible_version }}
      skip_git_test: true
      test_galaxy: true

# CentOS 8 Stream, latest supported Ansible version.

- stage: c8s_ansible_2_16
  dependsOn: []
  jobs:
  - template: templates/group_tests.yml
    parameters:
      build_number: $(Build.BuildNumber)
      distro: c8s
      ansible_version: "-core <2.17"
      skip_git_test: true
